name: Compilar BlackNDS e diagnostico R4

on:
  push:
    branches: [main]
    paths:
      - 'nds-port/**'
      - '.github/workflows/build-nds.yml'
  workflow_dispatch:

jobs:
  build-nds:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    defaults:
      run:
        working-directory: nds-port
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar ambiente
        run: |
          echo "DEVKITPRO=$DEVKITPRO DEVKITARM=$DEVKITARM"
          test -f "$DEVKITARM/ds_rules"
          test -d "$DEVKITPRO/libnds"
      - name: Compilar prototipo de jogo
        run: make -j2
      - name: Compilar ROM de diagnostico R4
        run: make -C diagnostic -j2
      - name: Compilar Hello World DS de referencia
        run: make -C hello-world-ds -j2
      - name: Validar as tres ROMs
        run: |
          test -s blacknds-prototype.nds
          test -s diagnostic/blacknds-r4-check.nds
          test -s hello-world-ds/hello-world-ds.nds
          ls -lh blacknds-prototype.nds diagnostic/blacknds-r4-check.nds hello-world-ds/hello-world-ds.nds
      - name: Publicar ROM de diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: BlackNDS-R4-Check-0.3
          path: nds-port/diagnostic/blacknds-r4-check.nds
          if-no-files-found: error
      - name: Publicar prototipo jogavel
        uses: actions/upload-artifact@v4
        with:
          name: BlackNDS-Prototipo-DS
          path: nds-port/blacknds-prototype.nds
          if-no-files-found: error

      - name: Publicar Hello World DS para testar R4
        uses: actions/upload-artifact@v4
        with:
          name: Hello-World-DS-Teste-R4
          path: nds-port/hello-world-ds/hello-world-ds.nds
          if-no-files-found: error
